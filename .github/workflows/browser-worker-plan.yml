name: browser worker plan

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    paths:
      - 'scheduler.py'
      - 'test_scheduler.py'
      - 'execution_budget_policy.json'
      - '.github/workflows/browser-worker-plan.yml'

permissions:
  contents: write

concurrency:
  group: browser-worker-plan
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AI_OS_CONTEXT_SHA: b99bd071ef9e595cb021e10218d6fc48cd3d6107
    steps:
      - uses: actions/checkout@v4
      - name: Checkout context compiler
        uses: actions/checkout@v4
        with:
          repository: GK-studio-JP/ai-os-context
          ref: ${{ env.AI_OS_CONTEXT_SHA }}
          path: context
      - name: Record provenance
        run: echo "AI_OS_PROVENANCE scheduler_sha=${GITHUB_SHA} context_sha=${AI_OS_CONTEXT_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e context
      - name: Build bounded projection
        run: aios-context snapshot --repo GK-studio-JP/ai-bulletin-board --state open --default-process PROC-BULLETIN --output-dir projection
      - name: Build Browser Chat Worker dispatch plan
        run: |
          python scheduler.py plan \
            --view projection/scheduler-view.json \
            --manifest projection/manifest.json \
            --budget-policy execution_budget_policy.json \
            --limit 1 \
            --process PROC-RUNTIME-BROWSER-WORKER \
            --output dispatch/browser-worker-plan.json
      - name: Validate Browser Chat Worker dispatch plan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path("dispatch/browser-worker-plan.json")
          plan = json.loads(plan_path.read_text())

          assert plan["schema"] == "ai-os-dispatch-plan:v1"
          assert plan["authoritative"] is False
          assert plan["filters"]["process"] == "PROC-RUNTIME-BROWSER-WORKER"
          assert plan["dispatch_count"] == len(plan["dispatches"])
          assert plan["dispatch_count"] <= 1
          assert plan["source"]["execution_budget_policy_fingerprint"].startswith("sha256:")

          for dispatch in plan["dispatches"]:
              assert dispatch["schema"] == "ai-os-dispatch:v1"
              assert dispatch["authoritative"] is False
              assert dispatch["process"] == "PROC-RUNTIME-BROWSER-WORKER"
              assert dispatch["task"].startswith("#")
              ctx = dispatch.get("context")
              assert ctx and ctx.get("capsule") and ctx.get("fingerprint")
              assert (Path("projection") / ctx["capsule"]).is_file()

              budget = dispatch.get("execution_budget")
              assert budget
              assert budget["schema"] == "ai-os-execution-budget:v1"
              assert budget["authoritative"] is False
              assert isinstance(budget["deadline_seconds"], int)
              assert budget["deadline_seconds"] > 0

          print("BROWSER_WORKER_DISPATCH_PLAN_OK", plan["dispatch_count"])
          PY
      - name: Read Browser Worker dispatch count
        id: browser_dispatch
        run: |
          count="$(python - <<'PY'
          import json
          print(json.load(open("dispatch/browser-worker-plan.json"))["dispatch_count"])
          PY
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Browser Worker dispatch count: $count"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-os-browser-worker-dispatch
          path: dispatch/
          retention-days: 7
      - name: Publish latest Browser Worker dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="browser-worker-dispatch"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Browser Worker Dispatch" \
              --notes "Machine-readable latest Browser Worker Scheduler output. This release is generated by GitHub Actions."
          fi
          gh release upload "$tag" dispatch/browser-worker-plan.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo "Published dispatch_count=${{ steps.browser_dispatch.outputs.count }}"

name: browser worker plan

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    paths:
      - 'scheduler.py'
      - 'test_scheduler.py'
      - '.github/workflows/browser-worker-plan.yml'

permissions:
  contents: write

concurrency:
  group: browser-worker-plan
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AI_OS_KERNEL_SHA: e26ae08c24d3fe271e0fb612084c12e1b148f34e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout control-plane registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GK-studio-JP/ai-os-kernel
          ref: ${{ env.AI_OS_KERNEL_SHA }}
          path: kernel
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve control-plane dependencies
        id: control_plane
        run: python kernel/control_plane_lock.py export-github --lock kernel/registry/control-plane-lock.json --output "$GITHUB_OUTPUT"
      - name: Checkout context compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GK-studio-JP/ai-os-context
          ref: ${{ steps.control_plane.outputs.context_sha }}
          path: context
          persist-credentials: false
      - name: Record provenance
        run: echo "AI_OS_PROVENANCE scheduler_sha=${GITHUB_SHA} kernel_sha=${AI_OS_KERNEL_SHA} context_sha=${{ steps.control_plane.outputs.context_sha }}"
      - run: python -m pip install -e context
      - name: Build bounded projection
        run: aios-context snapshot --repo GK-studio-JP/ai-bulletin-board --state open --default-process PROC-BULLETIN --output-dir projection
      - name: Build Browser Chat Worker dispatch plan
        run: |
          python scheduler.py plan \
            --view projection/scheduler-view.json \
            --manifest projection/manifest.json \
            --limit 1 \
            --process PROC-RUNTIME-BROWSER-WORKER \
            --output dispatch/browser-worker-plan.json
      - name: Validate Browser Chat Worker dispatch plan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path("dispatch/browser-worker-plan.json")
          plan = json.loads(plan_path.read_text())

          assert plan["schema"] == "ai-os-dispatch-plan:v1"
          assert plan["authoritative"] is False
          assert plan["filters"]["process"] == "PROC-RUNTIME-BROWSER-WORKER"
          assert plan["dispatch_count"] == len(plan["dispatches"])
          assert plan["dispatch_count"] <= 1

          for dispatch in plan["dispatches"]:
              assert dispatch["schema"] == "ai-os-dispatch:v1"
              assert dispatch["authoritative"] is False
              assert dispatch["process"] == "PROC-RUNTIME-BROWSER-WORKER"
              assert dispatch["task"].startswith("#")
              ctx = dispatch.get("context")
              assert ctx and ctx.get("capsule") and ctx.get("fingerprint") and ctx.get("content_digest")
              capsule_path = Path("projection") / ctx["capsule"]
              assert capsule_path.is_file()
              capsule = json.loads(capsule_path.read_text())
              source = capsule.get("source") or {}
              replay = capsule.get("replay") or {}
              assert ctx["fingerprint"] == capsule.get("fingerprint")
              assert ctx["content_digest"] == capsule.get("content_digest")
              assert ctx.get("through_comment_id") == source.get("canonical_through_comment_id")
              assert str(source.get("task_spec_fingerprint") or "").startswith("sha256:")
              assert "observed_comment_id" in source
              assert "canonical_through_comment_id" in source
              assert "idempotency_conflicts" in replay

          print("BROWSER_WORKER_DISPATCH_PLAN_OK", plan["dispatch_count"])
          PY
      - name: Read Browser Worker dispatch count
        id: browser_dispatch
        run: |
          count="$(python - <<'PY'
          import json
          print(json.load(open("dispatch/browser-worker-plan.json"))["dispatch_count"])
          PY
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Browser Worker dispatch count: $count"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-os-browser-worker-dispatch
          path: dispatch/
          retention-days: 7
      - name: Publish latest Browser Worker dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="browser-worker-dispatch"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Browser Worker Dispatch" \
              --notes "Machine-readable latest Browser Worker Scheduler output. This release is generated by GitHub Actions."
          fi
          gh release upload "$tag" dispatch/browser-worker-plan.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo "Published dispatch_count=${{ steps.browser_dispatch.outputs.count }}"

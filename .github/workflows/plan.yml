name: scheduler plan

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    paths:
      - 'scheduler.py'
      - 'test_scheduler.py'
      - 'process.json'
      - '.github/workflows/plan.yml'

permissions:
  contents: read

concurrency:
  group: scheduler-plan
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AI_OS_CONTEXT_SHA: bbfa99c928c2130470c851829cea8b5cccefb09f
    steps:
      - uses: actions/checkout@v4
      - name: Checkout context compiler
        uses: actions/checkout@v4
        with:
          repository: GK-studio-JP/ai-os-context
          ref: ${{ env.AI_OS_CONTEXT_SHA }}
          path: context
      - name: Record provenance
        run: echo "AI_OS_PROVENANCE scheduler_sha=${GITHUB_SHA} context_sha=${AI_OS_CONTEXT_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e context
      - name: Build bounded projection
        run: aios-context snapshot --repo GK-studio-JP/ai-bulletin-board --state open --default-process PROC-BULLETIN --output-dir projection
      - name: Build dispatch plan
        run: python scheduler.py plan --view projection/scheduler-view.json --manifest projection/manifest.json --limit 1 --output dispatch/plan.json
      - name: Validate dispatch plan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("dispatch/plan.json").read_text())
          assert plan["schema"] == "ai-os-dispatch-plan:v1"
          assert plan["authoritative"] is False
          assert plan["dispatch_count"] == len(plan["dispatches"])
          for dispatch in plan["dispatches"]:
              assert dispatch["schema"] == "ai-os-dispatch:v1"
              assert dispatch["authoritative"] is False
              ctx = dispatch.get("context")
              assert ctx and ctx.get("capsule") and ctx.get("fingerprint") and ctx.get("content_digest")
              assert (Path("projection") / ctx["capsule"]).is_file()
          print("DISPATCH_PLAN_OK", plan["dispatch_count"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-os-dispatch-plan
          path: dispatch/
          retention-days: 7
